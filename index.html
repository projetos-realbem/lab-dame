<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cultura de IA — Gestão de Iniciativas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#0B0F1A; --surface:#131A2B; --surface-2:#1B2438; --border:#232E47;
  --text:#E7ECF5; --text-muted:#8B96AC;
  --accent:#2DD4BF; --accent-soft:rgba(45,212,191,0.12);
  --amber:#F0A93B; --amber-soft:rgba(240,169,59,0.12);
  --rose:#E5687A; --rose-soft:rgba(229,104,122,0.12);
  --violet:#9D8CF0; --violet-soft:rgba(157,140,240,0.12);
  --slate:#7C8AA5; --slate-soft:rgba(124,138,165,0.12);
  --green:#4ADE80; --green-soft:rgba(74,222,128,0.12);
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
#app{max-width:1280px;margin:0 auto;padding:28px 32px 60px;}

.header{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.header .grow{flex:1;}
.flask{flex-shrink:0;}
.header h1{font-family:var(--font-display);font-size:21px;font-weight:600;margin:0;letter-spacing:-0.2px;}
.header p{margin:2px 0 0;color:var(--text-muted);font-size:13px;}
.header .who{font-size:12px;color:var(--text-muted);text-align:right;}
.header .who .email{color:var(--text);font-family:var(--font-mono);font-size:11.5px;}

.nav{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;}
.nav button{background:none;border:none;color:var(--text-muted);font-family:var(--font-body);font-size:14px;font-weight:500;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;transition:color .15s;}
.nav button:hover{color:var(--text);}
.nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
.nav svg{width:15px;height:15px;}
.nav .count-dot{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:0 6px;color:var(--text-muted);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
.section-title{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 12px;}

.stat-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.stat-pill{display:flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);}
.stat-pill .n{font-family:var(--font-mono);font-size:18px;font-weight:500;}
.stat-pill .l{font-size:12px;color:var(--text-muted);}

.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden;}
.hero-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.hero-card.fin::before{background:var(--green);}
.hero-card.op::before{background:var(--amber);}
.hero-card.roi::before{background:var(--violet);}
.hero-card.prio::before{background:var(--accent);}
.hero-card .hero-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
.hero-card .hero-value{font-family:var(--font-mono);font-size:28px;font-weight:500;line-height:1;}
.hero-card.fin .hero-value{color:var(--green);}
.hero-card.op .hero-value{color:var(--amber);}
.hero-card.roi .hero-value{color:var(--violet);}
.hero-card .hero-sub{font-size:12px;color:var(--text-muted);margin-top:6px;}

.bucket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:26px;}
.bucket-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;border-left:3px solid var(--accent);}
.bucket-card .num{font-family:var(--font-mono);font-size:26px;font-weight:500;color:var(--accent);}
.bucket-card .label{font-size:12.5px;color:var(--text-muted);margin-top:2px;line-height:1.35;}
.bucket-card .examples{margin-top:10px;font-size:12px;color:var(--text-muted);}
.bucket-card .examples div{padding:3px 0;border-top:1px solid var(--border);}
.bucket-card .examples div:first-child{border-top:none;}

.list-row{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--surface);cursor:pointer;transition:border-color .15s;}
.list-row:hover{border-color:var(--accent);}
.status-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;}
.list-row-body{flex:1;min-width:0;}
.list-row-title{font-weight:600;font-size:14px;margin-bottom:3px;}
.list-row-meta{font-size:12px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.gut-badge{font-family:var(--font-mono);font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:6px;white-space:nowrap;}

.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.chip{font-size:12.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}

.btn{font-family:var(--font-body);font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn svg{width:14px;height:14px;}
.btn:hover{background:rgba(45,212,191,0.2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text-muted);}
.btn-ghost:hover{color:var(--text);}
.btn-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}

.form-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;font-weight:500;}
.field .hint{font-weight:400;color:var(--slate);font-size:11.5px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:13.5px;padding:9px 11px;border-radius:7px;resize:vertical;}
.field input[type="checkbox"]{width:15px;height:15px;flex:none;padding:0;border-radius:3px;accent-color:var(--accent);}
.impact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px 14px;}
.impact-opt{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 11px;background:var(--surface);border:1px solid var(--border);border-radius:7px;cursor:pointer;}
.impact-opt:hover{border-color:var(--accent);}
.impact-opt span{flex:1;}
.impact-opt input{margin:0 2px 0 0;}
.impact-int{display:flex;flex-direction:column;gap:5px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
.impact-int-label{font-size:12.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.impact-int select{width:100%;}
.score-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:6px;}
.score-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.score-title{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);}
.score-live{font-family:var(--font-mono);font-weight:600;}
.field input[type="date"]{cursor:pointer;color-scheme:dark;}
.field input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7);cursor:pointer;padding:2px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:600px){.field-row,.field-row-3{grid-template-columns:1fr;}}

.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:720px){.rank-grid{grid-template-columns:1fr;}}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr;}}
.detail-field .k{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
.detail-field .v{font-size:14px;line-height:1.5;}
.detail-field .v.big{font-family:var(--font-mono);font-size:18px;}

.empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty svg{width:34px;height:34px;opacity:0.4;margin-bottom:10px;}
.empty p{font-size:13.5px;margin:0;}

.rank-num{font-family:var(--font-mono);font-size:16px;color:var(--text-muted);width:28px;text-align:center;flex-shrink:0;align-self:center;}
.divider{height:1px;background:var(--border);margin:18px 0;}

footer{margin-top:40px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;}
footer button{background:none;border:none;color:var(--text-muted);font-size:11.5px;cursor:pointer;text-decoration:underline;opacity:0.6;}
footer button:hover{opacity:1;}

.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);font-size:13px;}
/* Timeline de comentários e histórico */
.timeline{margin-top:18px;}
.timeline-title{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 12px;}
.timeline-list{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.tl-dot.status{background:var(--amber);}
.tl-dot.comentario{background:var(--accent);}
.tl-body{flex:1;min-width:0;}
.tl-texto{font-size:13.5px;line-height:1.5;margin-bottom:3px;}
.tl-meta{font-size:11.5px;color:var(--text-muted);}
.tl-form{display:flex;gap:8px;margin-top:12px;}
.tl-form input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 11px;border-radius:7px;}
.tl-form input:focus{outline:none;border-color:var(--accent);}
.tl-form button{flex-shrink:0;}
.tl-empty{font-size:13px;color:var(--text-muted);padding:8px 0;}
.mini-bar-wrap{background:var(--surface-2);border-radius:4px;height:6px;overflow:hidden;margin-top:6px;}
.mini-bar{height:100%;background:var(--accent);border-radius:4px;}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:50;max-width:90%;}
.toast.err{border-color:var(--rose);color:var(--rose);}
.toast.ok{border-color:var(--green);color:var(--green);}

/* public / login */
.center-wrap{max-width:960px;margin:4vh auto 0;}
.public-layout{display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start;}
@media(max-width:780px){.public-layout{grid-template-columns:1fr;}}
.public-note{font-size:12.5px;color:var(--text-muted);margin-top:14px;text-align:center;}
.link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;text-decoration:underline;}
.info-panel{display:flex;flex-direction:column;gap:12px;}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;}
.info-card .info-title{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 10px;}
.info-card .info-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:13px;line-height:1.45;}
.info-card .info-step:last-child{margin-bottom:0;}
.info-card .step-num{font-family:var(--font-mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:1px 7px;flex-shrink:0;margin-top:1px;}
.gut-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11.5px;padding:3px 9px;border-radius:6px;margin:2px;}

.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:13.5px;}
.banner strong{color:var(--accent);}
.config-warn{background:var(--rose-soft);border:1px solid var(--rose);border-radius:10px;padding:16px 18px;font-size:13.5px;line-height:1.5;}
.config-warn code{font-family:var(--font-mono);background:var(--surface);padding:1px 5px;border-radius:4px;font-size:12px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando…</div></div>
<div id="toast-root"></div>

<!-- Config local (NÃO versionada — ver config.example.js). Deve vir ANTES do SDK. -->
<script src="config.js"></script>
<!-- Supabase JS SDK (v2) via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   ┌─────────────────────────────────────────────────────────────────┐
   │  ÚLTIMA ATUALIZAÇÃO DO SISTEMA — edite esta linha a cada deploy   │
   └─────────────────────────────────────────────────────────────────┘ */
const BUILD_DATA = '2026-09-16 19:40';   // formato: AAAA-MM-DD HH:MM
const BUILD_NOTA = 'impactos ponderados'; // descrição curta da mudança (opcional)

/* =====================================================================
   CONFIGURAÇÃO — vem de window.APP_CONFIG, definido em config.js
   (arquivo fora do Git). Ver config.example.js para o modelo.
   ===================================================================== */
const SUPABASE_URL      = 'https://gcdrjkqexfbuenpkvovo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjZHJqa3FleGZidWVucGt2b3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzU2MjksImV4cCI6MjA5OTE1MTYyOX0.vDjZxPxjsBEMk-UPEboV3uzE4wpqSvfl-XoaEw5x37Y';

const CONFIGURED = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ===================== CONSTANTES ===================== */
const STATUS = ['Nova','Em Implementação','Implementado','Descartado','Em Pausa'];
const STATUS_COLOR = {
  'Nova':{c:'var(--slate)',bg:'var(--slate-soft)'},
  'Priorizado':{c:'var(--slate)',bg:'var(--slate-soft)'},
  'Em Implementação':{c:'var(--amber)',bg:'var(--amber-soft)'},
  'Implementado':{c:'var(--green)',bg:'var(--green-soft)'},
  'Descartado':{c:'var(--rose)',bg:'var(--rose-soft)'},
  'Em Pausa':{c:'var(--violet)',bg:'var(--violet-soft)'}
};
function iniColor(status){ return STATUS_COLOR[status] || STATUS_COLOR[(STATUS.find(s=>normStatus(s)===normStatus(status)))] || {c:'var(--slate)',bg:'var(--slate-soft)'}; }
const PROB_STATUS = ['Novo','Priorizado','Recusado'];
function normStatus(s){ return (s==null?'':String(s)).trim().toLowerCase(); }
const PROB_STATUS_COLOR = {
  'Novo':{c:'var(--accent)',bg:'var(--accent-soft)'},
  'Priorizado':{c:'var(--green)',bg:'var(--green-soft)'},
  'Recusado':{c:'var(--rose)',bg:'var(--rose-soft)'}
};
/* ===== IMPACTOS PONDERADOS (substitui a Matriz GUT) ===== */
// Fallback usado só se a tabela `impactos` ainda não existir/carregar.
const IMPACTOS_SEED = [
  {nome:'Geração de receita ou conversão', peso:5, ordem:1, ativo:true},
  {nome:'Redução de custo',                peso:5, ordem:2, ativo:true},
  {nome:'Redução de risco ou inadimplência',peso:4, ordem:3, ativo:true},
  {nome:'Tempo economizado',               peso:3, ordem:4, ativo:true},
  {nome:'Qualidade de entrega',            peso:3, ordem:5, ativo:true},
  {nome:'Velocidade de decisão',           peso:2, ordem:6, ativo:true}
];
// Escalas Nenhum/Baixo/Médio/Alto
const INTENSIDADES = [[0,'Nenhum'],[1,'Baixo'],[2,'Médio'],[3,'Alto']];
// Esforço: mesma escala, mas "Nenhum" vale 1 no denominador (nunca divide por zero)
const ESFORCOS = [[1,'Baixo'],[2,'Médio'],[3,'Alto']];
const ESFORCO_LABEL = {1:'Baixo',2:'Médio',3:'Alto'};

/* ===== ABORDAGENS (como a iniciativa será resolvida) ===== */
// Fallback usado só se a tabela `abordagens` ainda não existir/carregar.
const ABORDAGENS_SEED = [
  {nome:'Desenvolvimento com IA',        ordem:1, ativo:true},
  {nome:'Solução de mercado (compra)',   ordem:2, ativo:true},
  {nome:'Desenvolvimento interno (sem IA)',ordem:3, ativo:true},
  {nome:'Melhoria de processo',          ordem:4, ativo:true},
  {nome:'Automação (RPA/no-code)',       ordem:5, ativo:true},
  {nome:'Contratação / alocação de pessoas',ordem:6, ativo:true},
  {nome:'Não resolver / arquivar',       ordem:7, ativo:true}
];
function abordagensAtivas(){
  const list=(cache.abordagens||[]).filter(a=>a.ativo!==false);
  const base=list.length?list:ABORDAGENS_SEED;
  return [...base].sort((a,b)=>(a.ordem||0)-(b.ordem||0));
}

// Lista de impactos ativos (do cache, ordenados); cai no seed se vazio
function impactosAtivos(){
  const list=(cache.impactos||[]).filter(i=>i.ativo!==false);
  const base=list.length?list:IMPACTOS_SEED;
  return [...base].sort((a,b)=>(a.ordem||0)-(b.ordem||0));
}
function impactoPeso(nome){
  const i=(cache.impactos||[]).find(x=>normStatus(x.nome)===normStatus(nome));
  if(i) return Number(i.peso)||0;
  const s=IMPACTOS_SEED.find(x=>normStatus(x.nome)===normStatus(nome));
  return s?s.peso:0;
}
// intensidades marcadas: objeto {nome_impacto: intensidade}
function parseIntensidades(v){ if(!v) return {}; if(typeof v==='object') return v; try{ return JSON.parse(v)||{}; }catch(e){ return {}; } }
// score = Σ(peso × intensidade) ÷ esforço
function impactScore(item){
  const marc=parseIntensidades(item.impactos_json);
  let bruto=0;
  for(const nome in marc){ const inten=Number(marc[nome])||0; if(inten>0) bruto+=impactoPeso(nome)*inten; }
  const esf=Number(item.esforco)||1;
  return esf>0 ? bruto/esf : bruto;
}
function scoreColor(s){ if(s>=20)return{c:'var(--rose)',bg:'var(--rose-soft)',label:'Altíssimo'}; if(s>=10)return{c:'var(--amber)',bg:'var(--amber-soft)',label:'Alto'}; if(s>=4)return{c:'var(--accent)',bg:'var(--accent-soft)',label:'Médio'}; return{c:'var(--slate)',bg:'var(--slate-soft)',label:'Baixo'}; }
// resumo textual dos impactos marcados (para telas de detalhe/legado)
function impactosResumo(item){
  const marc=parseIntensidades(item.impactos_json);
  const labelInt=n=>((INTENSIDADES.find(([v])=>v===Number(n))||[])[1]||'');
  const parts=Object.keys(marc).filter(n=>Number(marc[n])>0).map(n=>`${n} (${labelInt(marc[n])})`);
  if(parts.length) return parts.join(', ');
  return item.impacto||''; // fallback texto legado
}

// grid de intensidade por impacto (usado nos formulários)
function impactoIntensidadeHtml(item){
  const marc=parseIntensidades(item&&item.impactos_json);
  const ativos=impactosAtivos();
  if(!ativos.length) return '<div style="font-size:12px;color:var(--text-muted)">Nenhum impacto cadastrado. Cadastre em Impactos.</div>';
  return `<div class="impact-grid">${ativos.map(imp=>{
    const cur=Number(marc[imp.nome]||0);
    return `<div class="impact-int"><div class="impact-int-label">${esc(imp.nome)} <span class="hint">peso ${imp.peso}</span></div>`+
      `<select name="imp::${esc(imp.nome)}">${INTENSIDADES.map(([v,l])=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
  }).join('')}</div>`;
}
// coleta as intensidades do form -> {nome: intensidade} (só as >0)

/* ===================== HELPERS ===================== */
function esc(s){ if(s===undefined||s===null)return''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){ if(!d)return'—'; const [y,m,day]=String(d).split('-'); return day&&m&&y?`${day}/${m}/${y}`:d; }
let _buildDateCache = null; // Date do Last-Modified, preenchido uma vez
function fmtBuild(){
  if(_buildDateCache) return fmtBuildFromDate(_buildDateCache);
  const [dt,hr]=String(BUILD_DATA).trim().split(/\s+/); const [y,m,d]=(dt||'').split('-'); const dataBr=(y&&m&&d)?`${d}/${m}/${y}`:(dt||BUILD_DATA); const quando=hr?`${dataBr} às ${hr}`:dataBr; return `atualizado em ${quando}${BUILD_NOTA?' · '+BUILD_NOTA:''}`;
}
// formata um Date -> "atualizado em DD/MM/AAAA às HH:MM · nota"
function fmtBuildFromDate(dtObj){
  const dd=String(dtObj.getDate()).padStart(2,'0');
  const mm=String(dtObj.getMonth()+1).padStart(2,'0');
  const yy=dtObj.getFullYear();
  const hh=String(dtObj.getHours()).padStart(2,'0');
  const mi=String(dtObj.getMinutes()).padStart(2,'0');
  return `atualizado em ${dd}/${mm}/${yy} às ${hh}:${mi}${BUILD_NOTA?' · '+BUILD_NOTA:''}`;
}
// busca a data real do arquivo servido (Last-Modified) uma vez, cacheia e
// atualiza o rodapé; se falhar (ex.: file:// local) mantém o fallback manual
async function refreshBuildStamp(){
  if(_buildDateCache){ const el=document.getElementById('buildStamp'); if(el) el.textContent=fmtBuild(); return; }
  try{
    const resp=await fetch(window.location.href,{method:'HEAD',cache:'no-store'});
    const lm=resp.headers.get('Last-Modified');
    if(lm){ const d=new Date(lm); if(!isNaN(d)){ _buildDateCache=d; const el=document.getElementById('buildStamp'); if(el) el.textContent=fmtBuild(); } }
  }catch(e){ /* mantém o texto de fallback já renderizado */ }
}
function fmtMoney(n){ return 'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtHoras(n){ return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'h'; }
/* ---- máscara de valores (pt-BR) ---- */
function parseNum(v){ if(v==null) return 0; let s=String(v).replace(/[^\d.,-]/g,'').trim(); if(!s) return 0; if(s.includes(',')){ s=s.replace(/\./g,'').replace(',','.'); } const n=parseFloat(s); return isNaN(n)?0:n; }
function fmtNum(n,dec){ return (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:dec||0,maximumFractionDigits:dec===undefined?2:dec}); }
function maskMoneyInput(el){
  let digits=el.value.replace(/\D/g,'');
  if(!digits){ el.value=''; return; }
  digits=digits.replace(/^0+(?=\d)/,'');
  const cents=digits.padStart(3,'0');
  const int=cents.slice(0,-2), frac=cents.slice(-2);
  el.value=Number(int).toLocaleString('pt-BR')+','+frac;
}
function maskIntInput(el){
  let digits=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  el.value=digits?Number(digits).toLocaleString('pt-BR'):'';
}
function attachMasks(form){
  form.querySelectorAll('[data-mask="money"]').forEach(el=>{ maskMoneyInput(el); el.addEventListener('input',()=>maskMoneyInput(el)); });
  form.querySelectorAll('[data-mask="int"]').forEach(el=>{ maskIntInput(el); el.addEventListener('input',()=>maskIntInput(el)); });
}
function toast(msg, kind){

async function refreshAll(){
  if(!sb) return;
  const [pr, ini, ses, com, imp, abo] = await Promise.all([
    sb.from('problemas').select('*'),
    sb.from('iniciativas').select('*'),
    sb.from('sessoes').select('*'),
    sb.from('comentarios').select('*').order('criado_em',{ascending:true}),
    sb.from('impactos').select('*'),
    sb.from('abordagens').select('*')
  ]);
  if(pr.error && pr.error.code!=='42501') console.error(pr.error);
  cache.problemas   = pr.data   || [];
  cache.iniciativas = ini.data  || [];
  cache.sessoes     = ses.data  || [];
  cache.comentarios = com.data  || [];
  cache.impactos    = (imp && imp.data) || [];
  cache.abordagens  = (abo && abo.data) || [];
}

function timelineHtml(comentarios, vinculoKey, vinculoId, inputId){
  const itens = comentarios.filter(c => c[vinculoKey] === vinculoId)

          <div class="tl-body">
            <div class="tl-texto">${esc(c.texto)}</div>

          </div>
        </div>`).join('')
    : '<div class="tl-empty">Nenhum comentário ainda.</div>';
  return `
    <div class="divider"></div>
    <div class="timeline">

function attachTimelineHandler(content, inputId, vinculo){
  const inp = content.querySelector('#'+inputId);
  const btn = content.querySelector('#'+inputId+'Btn');
  if(!inp||!btn) return;
  btn.addEventListener('click', async ()=>{
    const txt = inp.value.trim();
    if(!txt) return;
    btn.disabled = true;
    const err = await addComentario(vinculo, txt);

    <div id="content"></div>
    <footer><button id="refreshBtn">recarregar dados</button></footer>`;
  app.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{ currentTab=b.dataset.tab; openForm=null; openDetail=null; openImpForm=null; openAboForm=null; render(); }));
  app.querySelector('#logoutBtn').addEventListener('click', doLogout);
  app.querySelector('#refreshBtn').addEventListener('click', async ()=>{ await refreshAll(); render(); toast('Dados recarregados','ok'); });
  refreshBuildStamp();

  const content=document.getElementById('content');
  if(currentTab==='dashboard') content.innerHTML=renderDashboard();
  if(currentTab==='problemas') renderProblemasTab(content);
  if(currentTab==='iniciativas') renderIniciativasTab(content);
  if(currentTab==='sessoes') renderSessoesTab(content);
  if(currentTab==='impactos') renderImpactosTab(content);
}

/* ===================== IMPACTOS (admin) ===================== */
function renderImpactosTab(content){
  const list=[...(cache.impactos||[])].sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const editing = openImpForm && openImpForm!=='new' ? list.find(i=>i.id===openImpForm) : null;
  const semTabela = !cache.impactos; // não deveria ocorrer, mas guarda

  let html=`<div class="top-actions"><div><div class="section-title" style="margin:0">Impactos e pesos</div><div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">O peso multiplica a intensidade marcada em cada problema/iniciativa. Score = (Σ peso × intensidade) ÷ esforço.</div></div><button class="btn" id="newImpBtn">+ Novo impacto</button></div>`;

  if(openImpForm){
    const e=editing||{nome:'',peso:3,ordem:(list.length?Math.max(...list.map(i=>i.ordem||0))+1:1),ativo:true};
    html+=`<div class="form-panel"><div class="section-title">${editing?'Editar impacto':'Novo impacto'}</div><form id="impForm">
      <div class="field"><label>Nome</label><input name="nome" required value="${esc(e.nome)}" placeholder="Ex: Redução de custo"></div>
      <div class="field-row"><div class="field"><label>Peso <span class="hint">— importância relativa</span></label><input name="peso" type="number" min="0" step="1" required value="${e.peso}"></div><div class="field"><label>Ordem <span class="hint">— posição na lista</span></label><input name="ordem" type="number" min="0" step="1" value="${e.ordem||0}"></div></div>
      ${editing?`<div class="field"><label><input type="checkbox" name="ativo" ${e.ativo!==false?'checked':''} style="width:15px;height:15px;margin-right:8px;vertical-align:-2px">Ativo <span class="hint">— impactos inativos não aparecem nos formulários, mas o histórico é preservado</span></label></div>`:''}
      <div class="btn-row"><button type="submit" class="btn" id="saveImp">Salvar</button><button type="button" class="btn btn-ghost" id="cancelImp">Cancelar</button></div>
    </form></div>`;
  }

  html+=`<div class="card">`;
  if(!list.length){
    html+=`<div style="font-size:13px;color:var(--text-muted);padding:8px 4px">Nenhum impacto cadastrado ainda. Use "+ Novo impacto" para começar.${(IMPACTOS_SEED.length?' A migração SQL já semeia uma lista sugerida.':'')}</div>`;
  } else {
    html+=list.map(i=>`<div class="list-row" style="cursor:default"><div class="list-row-body"><div class="list-row-title" style="font-size:14px">${esc(i.nome)} ${i.ativo===false?'<span class="badge" style="background:var(--slate-soft);color:var(--slate)">inativo</span>':''}</div><div class="list-row-meta"><span class="gut-badge" style="background:var(--accent-soft);color:var(--accent)">peso ${i.peso}</span><span>ordem ${i.ordem||0}</span></div></div><div class="btn-row" style="margin:0"><button class="btn btn-ghost imp-edit" data-id="${i.id}">Editar</button><button class="btn btn-ghost imp-toggle" data-id="${i.id}">${i.ativo===false?'Ativar':'Desativar'}</button></div></div>`).join('');
  }
  html+=`</div>`;
  content.innerHTML=html;

  const nb=content.querySelector('#newImpBtn'); if(nb) nb.addEventListener('click',()=>{openImpForm='new';render();});
  content.querySelectorAll('.imp-edit').forEach(b=>b.addEventListener('click',()=>{openImpForm=b.dataset.id;render();}));
  content.querySelectorAll('.imp-toggle').forEach(b=>b.addEventListener('click',async()=>{
    const imp=list.find(i=>i.id===b.dataset.id); if(!imp)return;
    const err=await updateRow('impactos',imp.id,{ativo:imp.ativo===false});
    if(err){toast('Erro ao atualizar','err');console.error(err);return;}
    await refreshAll();render();toast('Atualizado','ok');
  }));

  const form=content.querySelector('#impForm');
  if(form){
    content.querySelector('#cancelImp').addEventListener('click',()=>{openImpForm=null;render();});
    form.addEventListener('submit',async(e)=>{
      e.preventDefault(); if(busy)return; busy=true;
      const b=content.querySelector('#saveImp'); b.disabled=true;
      const fd=new FormData(form);const d=Object.fromEntries(fd.entries());
      const payload={nome:(d.nome||'').trim(),peso:Number(d.peso)||0,ordem:Number(d.ordem)||0};
      let err;
      if(editing){ payload.ativo=form.querySelector('[name="ativo"]')?form.querySelector('[name="ativo"]').checked:true; err=await updateRow('impactos',editing.id,payload); }
      else { payload.ativo=true; err=(await insertRow('impactos',payload)).error; }

      if(err){ toast('Erro ao salvar','err'); console.error(err); b.disabled=false; return; }
      openImpForm=null; await refreshAll(); render(); toast('Salvo','ok');
    });
  }

  // ---------- Seção: Abordagens de resolução ----------
  const aboList=[...(cache.abordagens||[])].sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const aboEditing = openAboForm && openAboForm!=='new' ? aboList.find(a=>a.id===openAboForm) : null;

  let ahtml=`<div class="top-actions" style="margin-top:30px"><div><div class="section-title" style="margin:0">Abordagens de resolução</div><div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">Como uma iniciativa priorizada será tratada (uso de IA, compra de mercado, melhoria de processo, etc.).</div></div><button class="btn" id="newAboBtn">+ Nova abordagem</button></div>`;

  if(openAboForm){
    const e=aboEditing||{nome:'',ordem:(aboList.length?Math.max(...aboList.map(a=>a.ordem||0))+1:1),ativo:true};
    ahtml+=`<div class="form-panel"><div class="section-title">${aboEditing?'Editar abordagem':'Nova abordagem'}</div><form id="aboForm">
      <div class="field-row"><div class="field"><label>Nome</label><input name="nome" required value="${esc(e.nome)}" placeholder="Ex: Desenvolvimento com IA"></div><div class="field" style="max-width:140px"><label>Ordem</label><input name="ordem" type="number" min="0" step="1" value="${e.ordem||0}"></div></div>
      ${aboEditing?`<div class="field"><label><input type="checkbox" name="ativo" ${e.ativo!==false?'checked':''} style="width:15px;height:15px;margin-right:8px;vertical-align:-2px">Ativa <span class="hint">— abordagens inativas não aparecem no formulário, mas o histórico é preservado</span></label></div>`:''}
      <div class="btn-row"><button type="submit" class="btn" id="saveAbo">Salvar</button><button type="button" class="btn btn-ghost" id="cancelAbo">Cancelar</button></div>
    </form></div>`;
  }

  ahtml+=`<div class="card">`;
  if(!aboList.length){
    ahtml+=`<div style="font-size:13px;color:var(--text-muted);padding:8px 4px">Nenhuma abordagem cadastrada ainda. Use "+ Nova abordagem" para começar. A migração SQL já semeia uma lista sugerida.</div>`;
  } else {
    ahtml+=aboList.map(a=>`<div class="list-row" style="cursor:default"><div class="list-row-body"><div class="list-row-title" style="font-size:14px">${esc(a.nome)} ${a.ativo===false?'<span class="badge" style="background:var(--slate-soft);color:var(--slate)">inativa</span>':''}</div><div class="list-row-meta"><span>ordem ${a.ordem||0}</span></div></div><div class="btn-row" style="margin:0"><button class="btn btn-ghost abo-edit" data-id="${a.id}">Editar</button><button class="btn btn-ghost abo-toggle" data-id="${a.id}">${a.ativo===false?'Ativar':'Desativar'}</button></div></div>`).join('');
  }
  ahtml+=`</div>`;
  content.insertAdjacentHTML('beforeend', ahtml);

  const anb=content.querySelector('#newAboBtn'); if(anb) anb.addEventListener('click',()=>{openAboForm='new';render();});
  content.querySelectorAll('.abo-edit').forEach(b=>b.addEventListener('click',()=>{openAboForm=b.dataset.id;render();}));
  content.querySelectorAll('.abo-toggle').forEach(b=>b.addEventListener('click',async()=>{
    const abo=aboList.find(a=>a.id===b.dataset.id); if(!abo)return;
    const err=await updateRow('abordagens',abo.id,{ativo:abo.ativo===false});
    if(err){toast('Erro ao atualizar','err');console.error(err);return;}
    await refreshAll();render();toast('Atualizado','ok');
  }));

  const aform=content.querySelector('#aboForm');
  if(aform){
    content.querySelector('#cancelAbo').addEventListener('click',()=>{openAboForm=null;render();});
    aform.addEventListener('submit',async(e)=>{
      e.preventDefault(); if(busy)return; busy=true;
      const b=content.querySelector('#saveAbo'); b.disabled=true;
      const fd=new FormData(aform);const d=Object.fromEntries(fd.entries());
      const payload={nome:(d.nome||'').trim(),ordem:Number(d.ordem)||0};
      let err;
      if(aboEditing){ payload.ativo=aform.querySelector('[name="ativo"]')?aform.querySelector('[name="ativo"]').checked:true; err=await updateRow('abordagens',aboEditing.id,payload); }
      else { payload.ativo=true; err=(await insertRow('abordagens',payload)).error; }
      busy=false;
      if(err){ toast('Erro ao salvar','err'); console.error(err); b.disabled=false; return; }
      openAboForm=null; await refreshAll(); render(); toast('Salvo','ok');
    });
  }
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const casos=cache.iniciativas;
  const isImplementado=c=>normStatus(c.status)===normStatus('Implementado');
  const isEmImplementacao=c=>normStatus(c.status)===normStatus('Em Implementação');
  const implementadas=casos.filter(isImplementado);
  const emAndamento=casos.filter(isEmImplementacao);
  const ativas=casos.filter(c=>isImplementado(c)||isEmImplementacao(c));
  const ganhoFin=ativas.reduce((s,c)=>s+(Number(c.ganho_fin)||0),0);
  const ganhoOp=ativas.reduce((s,c)=>s+(Number(c.ganho_op)||0),0);
  const custoTotal=ativas.reduce((s,c)=>s+(Number(c.custo)||0),0);
  const roi=custoTotal>0?((ganhoFin*12-custoTotal)/custoTotal*100):null;

  // prioridade da fila: problemas "Novo" ordenados por score de impacto
  const fila=cache.problemas.filter(p=>normStatus(p.status)===normStatus('Novo'));
  const filaScores=fila.map(p=>impactScore(p)).filter(s=>s>0);
  const topFila=filaScores.length?Math.max(...filaScores):0;
  const scTop=scoreColor(topFila);

  const heroHtml=`
    <div class="hero-card fin"><div class="hero-label">Ganho financeiro / mês</div><div class="hero-value">${fmtMoney(ganhoFin)}</div><div class="hero-sub">${ativas.length} iniciativa(s) ativa(s) · ${implementadas.length} implementada(s), ${emAndamento.length} em andamento</div></div>
    <div class="hero-card op"><div class="hero-label">Ganho operacional / mês</div><div class="hero-value">${fmtHoras(ganhoOp)}</div><div class="hero-sub">Horas economizadas por mês</div></div>
    <div class="hero-card roi"><div class="hero-label">Retorno anualizado</div><div class="hero-value">${roi===null?'—':(roi>=0?'+':'')+Math.round(roi)+'%'}</div><div class="hero-sub">${custoTotal>0?`Sobre ${fmtMoney(custoTotal)} investidos`:'Informe custos nas iniciativas'}</div></div>
    <div class="hero-card prio"><div class="hero-label">Prioridade no topo da fila</div><div class="hero-value" style="color:${scTop.c}">${fila.length?topFila.toFixed(1):'—'}</div><div class="hero-sub">${fila.length?`${fila.length} problema(s) aguardando · maior score ${scTop.label}`:'Nenhum problema novo na fila'}</div></div>`;

  const funil=`<div class="stat-strip">
    <div class="stat-pill" style="background:var(--accent-soft);border-color:var(--accent)33"><span class="n" style="color:var(--accent)">${cache.problemas.filter(p=>p.status==='Novo').length}</span><span class="l">Problemas na fila</span></div>
    ${STATUS.map(s=>{const col=STATUS_COLOR[s]||{c:'var(--slate)',bg:'var(--slate-soft)'};const n=casos.filter(c=>{const a=normStatus(c.status),b=normStatus(s);return a===b||(b===normStatus('Nova')&&a===normStatus('Priorizado'));}).length;return `<div class="stat-pill" style="background:${col.bg};border-color:${col.c}33"><span class="n" style="color:${col.c}">${n}</span><span class="l">${s}</span></div>`;}).join('')}
  </div>`;

  const ativos=casos.filter(c=>isImplementado(c)||isEmImplementacao(c));
  const intensidadeDe=(c,nome)=>{const m=parseIntensidades(c.impactos_json);if(m&&Object.keys(m).length)return Number(m[nome])||0;return String(c.bucket||'').split(/\s*,\s*/).includes(nome)?1:0;};
  const bucketsData=impactosAtivos().map(imp=>{
    const b=imp.nome;
    const cb=ativos.filter(c=>intensidadeDe(c,b)>0);
    const valor=ativos.reduce((s,c)=>s+intensidadeDe(c,b)*(Number(imp.peso)||0),0);
    return {nome:b, n:cb.length, valor};
  }).sort((a,b)=>b.valor-a.valor);
  const maxValor=Math.max(...bucketsData.map(d=>d.valor),1);
  const barRow=(nome,valor,n,max,vazio)=>{
    const w=Math.max(2, valor/max*100);
    const cor=vazio?'var(--border-strong)':'var(--accent)';
    const tcol=vazio?'color:var(--text-muted)':'';
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span style="font-size:12px;width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${tcol}" title="${esc(nome)}${n!=null?' · '+n+' iniciativa(s)':''}">${esc(nome)}</span><div class="mini-bar-wrap" style="flex:1;margin:0"><div class="mini-bar" style="width:${w}%;background:${cor}"></div></div><span style="font-family:var(--font-mono);font-size:13px;font-weight:500;width:28px;text-align:right;${tcol}">${valor}</span></div>`;
  };
  const bucketsHtml=bucketsData.map(d=>barRow(d.nome,d.valor,d.n,maxValor,d.valor===0)).join('')||`<div class="empty"><p>Nenhum impacto registrado ainda.</p></div>`;

  // resumo de abordagens escolhidas (todas as iniciativas com abordagem definida)
  const aboCount={};
  cache.iniciativas.forEach(c=>{ if(c.abordagem){ aboCount[c.abordagem]=(aboCount[c.abordagem]||0)+1; } });
  const aboData=abordagensAtivas().map(a=>({nome:a.nome, n:aboCount[a.nome]||0}));
  // inclui abordagens legadas/inativas que tenham iniciativas
  Object.keys(aboCount).forEach(nome=>{ if(!aboData.some(a=>normStatus(a.nome)===normStatus(nome))) aboData.push({nome, n:aboCount[nome]}); });
  aboData.sort((a,b)=>b.n-a.n);
  const maxAbo=Math.max(...aboData.map(d=>d.n),1);
  const abordagensHtml=aboData.length?aboData.map(d=>barRow(d.nome,d.n,null,maxAbo,d.n===0)).join(''):`<div class="empty"><p>Nenhuma abordagem definida ainda.</p></div>`;

  const ranked=[...casos].filter(c=>isImplementado(c)||isEmImplementacao(c)).sort((a,b)=>(Number(b.ganho_fin)||0)-(Number(a.ganho_fin)||0)).slice(0,6);
  const maxFin=ranked.length?Math.max(...ranked.map(c=>Number(c.ganho_fin)||0),1):1;
  const rankHtml=ranked.length?ranked.map(c=>{const col=iniColor(c.status);const w=Math.max(4,(Number(c.ganho_fin)||0)/maxFin*100);return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;gap:10px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.codigo||'')} ${esc(c.titulo)}</span><span style="font-family:var(--font-mono);color:var(--green);white-space:nowrap">${fmtMoney(c.ganho_fin)}/mês</span></div><div class="mini-bar-wrap"><div class="mini-bar" style="width:${w}%;background:${col.c}"></div></div></div>`;}).join(''):`<div class="empty"><p>Nenhuma iniciativa com ganho registrado ainda.</p></div>`;

  // ranking por score de impacto (nova métrica de priorização)
  const rankedScore=[...casos].filter(c=>isImplementado(c)||isEmImplementacao(c)).map(c=>({c,s:impactScore(c)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);
  const maxScore=rankedScore.length?Math.max(...rankedScore.map(x=>x.s),1):1;
  const rankScoreHtml=rankedScore.length?rankedScore.map(({c,s})=>{const sc=scoreColor(s);const w=Math.max(4,s/maxScore*100);return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;gap:10px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.codigo||'')} ${esc(c.titulo)}</span><span style="font-family:var(--font-mono);color:${sc.c};white-space:nowrap">${s.toFixed(1)}</span></div><div class="mini-bar-wrap"><div class="mini-bar" style="width:${w}%;background:${sc.c}"></div></div></div>`;}).join(''):`<div class="empty"><p>Nenhuma iniciativa com impacto registrado ainda.</p></div>`;

  const recent=[...cache.sessoes].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,3);
  const sessoesHtml=recent.length?recent.map(s=>`<div class="list-row" style="cursor:default"><div class="status-bar" style="background:var(--accent)"></div><div class="list-row-body"><div class="list-row-title"><span style="font-family:var(--font-mono);color:var(--text-muted);font-size:11.5px;margin-right:7px">${esc(s.codigo||'')}</span>Sessão ${esc(s.numero||'—')} · ${fmtDate(s.data)}</div><div class="list-row-meta"><span>Âncora: ${esc(s.ancora||'—')}</span><span>${esc(s.formato||'—')}</span></div></div></div>`).join(''):`<div class="empty"><p>Nenhuma sessão registrada ainda.</p></div>`;

  return `<div class="section-title">Ganhos consolidados</div><div class="hero-grid">${heroHtml}</div>
    <div class="section-title">Funil de iniciativas</div>${funil}
    <div class="rank-grid">
      <div><div class="section-title" style="margin-top:22px">Top iniciativas por ganho financeiro</div><div class="card">${rankHtml}</div></div>
      <div><div class="section-title" style="margin-top:22px">Top iniciativas por score de impacto</div><div class="card">${rankScoreHtml}</div></div>
    </div>
    <div class="rank-grid" style="margin-top:24px">
      <div><div class="section-title" style="margin-top:0">Valor por dimensão de impacto <span class="hint" style="text-transform:none;letter-spacing:0">— peso × intensidade</span></div><div class="card">${bucketsHtml}</div></div>
      <div><div class="section-title" style="margin-top:0">Iniciativas por abordagem <span class="hint" style="text-transform:none;letter-spacing:0">— como estão sendo tratadas</span></div><div class="card">${abordagensHtml}</div></div>
    </div>
    <div class="section-title">Últimas sessões</div><div class="card">${sessoesHtml}</div>`;
}

/* ===================== PROBLEMAS (admin) ===================== */
function renderProblemasTab(content){
  const detail = openDetail&&openDetail.type==='problema' ? cache.problemas.find(p=>p.id===openDetail.id) : null;
  let list=cache.problemas;
  if(filterProbStatus!=='all') list=list.filter(p=>normStatus(p.status)===normStatus(filterProbStatus));
  list=[...list].sort((a,b)=>impactScore(b)-impactScore(a)||(new Date(b.criado_em)-new Date(a.criado_em)));

  let html=`<div class="top-actions"><div class="filters">${PROB_STATUS.map(s=>`<div class="chip ${filterProbStatus===s?'active':''}" data-pf="${s}">${s}</div>`).join('')}</div><button class="btn" id="newProbBtn">+ Novo problema</button></div>`;

  if(openForm==='problema') html+=problemaFormHtml(detail);
  else if(detail) html+=problemaDetailHtml(detail);

  if(!openForm&&!detail){
    if(list.length){
      html+=`<div class="section-title">Fila priorizada por GUT (maior score no topo)</div>`;
      html+=list.map((p,i)=>{const score=impactScore(p);const gc=scoreColor(score);const sc=(PROB_STATUS_COLOR[p.status]||PROB_STATUS_COLOR['Novo']);const ses=p.sessao_id?cache.sessoes.find(x=>x.id===p.sessao_id):null;const sesBadge=p.sessao_id?`<span class="badge" style="background:var(--accent-soft);color:var(--accent)" title="Vinculado a uma sessão"><svg viewBox="0 0 24 24" width="11" height="11" style="vertical-align:-1px;margin-right:3px" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${ses?esc(ses.codigo||('Sessão '+(ses.numero||''))):'Em sessão'}</span>`:'';return `<div class="list-row" data-openprob="${p.id}"><div class="rank-num">${i+1}</div><div class="status-bar" style="background:${sc.c}"></div><div class="list-row-body"><div class="list-row-title"><span style="font-family:var(--font-mono);color:var(--text-muted);font-size:11.5px;margin-right:7px">${esc(p.codigo||'')}</span>${esc(p.titulo)}</div><div class="list-row-meta"><span class="gut-badge" style="background:${gc.bg};color:${gc.c}">Score ${score.toFixed(1)} · ${gc.label}</span><span class="badge" style="background:${sc.bg};color:${sc.c}">${p.status}</span>${sesBadge}<span>${esc(p.area||'—')}</span><span>por ${esc(p.solicitante||'—')}</span></div></div></div>`;}).join('');
    } else html+=`<div class="empty">${iconInbox()}<p>Nenhum problema nesse filtro.</p></div>`;
  }
  content.innerHTML=html;
  content.querySelectorAll('.filters .chip[data-pf]').forEach(ch=>ch.addEventListener('click',()=>{filterProbStatus=ch.dataset.pf;openForm=null;openDetail=null;render();}));
  const nb=content.querySelector('#newProbBtn'); if(nb) nb.addEventListener('click',()=>{openForm='problema';openDetail=null;render();});
  content.querySelectorAll('[data-openprob]').forEach(r=>r.addEventListener('click',()=>{openDetail={type:'problema',id:r.dataset.openprob};render();}));
  if(openForm==='problema') attachProblemaFormHandlers(content, detail);
  else attachProblemaDetailHandlers(content, detail);
}

// recalcula o score de impacto ao vivo conforme o usuário mexe nos selects
function attachScoreLive(form, isPublic){
  if(!form) return;
  const recalc=()=>{
    const inten=collectIntensidades(form);
    const esfEl=form.querySelector('[name="esforco"]');
    const esf=esfEl?Number(esfEl.value)||1:1;
    if(isPublic){ impBuffer={intensidades:inten, esforco:esf}; }
    const sc=impactScore({impactos_json:inten, esforco:esf});
    const col=scoreColor(sc);const el=form.querySelector('#scoreLive');
    if(el){el.textContent=`Score ${sc.toFixed(1)} · ${col.label}`;el.style.color=col.c;}
  };
  form.querySelectorAll('select[name^="imp::"],[name="esforco"]').forEach(s=>s.addEventListener('change',recalc));
}

  }
  content.innerHTML=html;
  const nb=content.querySelector('#newSessaoBtn'); if(nb) nb.addEventListener('click',()=>{openForm='sessao';openDetail=null;render();});
  content.querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click',()=>{openDetail={type:'sessao',id:r.dataset.open};render();}));
  attachSessaoFormHandlers(content,detail);
  attachSessaoDetailHandlers(content,detail);
}
function sessaoFilaCandidatos(editing){
  const probOk=st=>normStatus(st)===normStatus('Novo')||normStatus(st)===normStatus('Priorizado');
  const problemas=cache.problemas.filter(p=>(editing&&p.sessao_id===editing.id)||(probOk(p.status)&&!p.sessao_id))
    .sort((a,b)=>impactScore(b)-impactScore(a));
  const iniOk=st=>normStatus(st)===normStatus('Nova')||normStatus(st)===normStatus('Priorizado');
  const iniciativas=cache.iniciativas.filter(c=>(editing&&c.sessao_id===editing.id)||(iniOk(c.status)&&!c.sessao_id))
    .sort((a,b)=>(a.titulo||'').localeCompare(b.titulo||''));
  return {problemas,iniciativas};
}
function sessaoFormHtml(editing){
  const s=editing||{};
  const {problemas,iniciativas}=sessaoFilaCandidatos(editing);
  const probHtml=problemas.length?problemas.map(p=>{const score=impactScore(p);const gc=scoreColor(score);return `<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 2px"><input type="checkbox" name="prob_ids" value="${p.id}" ${p.sessao_id===s.id?'checked':''}><span style="font-family:var(--font-mono);color:var(--text-muted);font-size:11px">${esc(p.codigo||'')}</span><span style="flex:1">${esc(p.titulo)}</span><span class="gut-badge" style="background:${gc.bg};color:${gc.c};font-size:10.5px">Score ${score.toFixed(1)}</span></label>`;}).join(''):`<div style="font-size:12px;color:var(--text-muted);padding:4px 2px">Nenhum problema disponível na fila.</div>`;
  const iniHtml=iniciativas.length?iniciativas.map(c=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 2px"><input type="checkbox" name="ini_ids" value="${c.id}" ${c.sessao_id===s.id?'checked':''}><span style="font-family:var(--font-mono);color:var(--text-muted);font-size:11px">${esc(c.codigo||'')}</span><span style="flex:1">${esc(c.titulo)}</span></label>`).join(''):`<div style="font-size:12px;color:var(--text-muted);padding:4px 2px">Nenhuma iniciativa priorizada aguardando sessão.</div>`;
  return `<div class="form-panel"><div class="section-title">${editing?'Editar sessão':'Nova sessão'}</div><form id="sessaoForm">
    <div class="field-row"><div class="field"><label>Data</label><input type="date" name="data" value="${esc(s.data)||today()}"></div><div class="field"><label>Número</label><input name="numero" value="${esc(s.numero)}" placeholder="Ex: 03"></div></div>
    <div class="field-row"><div class="field"><label>Âncora</label><input name="ancora" value="${esc(s.ancora)}"></div><div class="field"><label>Formato</label><select name="formato">${FORMATOS.map(f=>`<option ${s.formato===f?'selected':''}>${f}</option>`).join('')}</select></div></div>
    <div class="field"><label>Problemas na fila <span class="hint">status Novo ou Priorizado</span></label><div class="card" style="max-height:200px;overflow:auto;padding:6px 10px">${probHtml}</div></div>
    <div class="field"><label>Iniciativas priorizadas <span class="hint">aguardando sessão</span></label><div class="card" style="max-height:200px;overflow:auto;padding:6px 10px">${iniHtml}</div></div>
    <div class="field"><label>Notas / tema central</label><textarea name="problema" rows="2">${esc(s.problema)}</textarea></div>
    <div class="field"><label>Decisões de priorização</label><textarea name="resultado" rows="2">${esc(s.resultado)}</textarea></div>
    <div class="field"><label>Aprendizados</label><textarea name="aprendizados" rows="2">${esc(s.aprendizados)}</textarea></div>
    <div class="btn-row"><button type="submit" class="btn" id="saveSessao">Salvar</button><button type="button" class="btn btn-ghost" id="cancelSessao">Cancelar</button></div>
  </form></div>`;
}
function attachSessaoFormHandlers(content,editing){
  const form=content.querySelector('#sessaoForm'); if(!form) return;
  content.querySelector('#cancelSessao').addEventListener('click',()=>{openForm=null;render();});
  form.addEventListener('submit', async (e)=>{
    e.preventDefault(); if(busy)return; busy=true;
    const b=content.querySelector('#saveSessao'); b.disabled=true;
    const fd=new FormData(form);const d=Object.fromEntries(fd.entries());
    const checkedProbIds=fd.getAll('prob_ids');
    const checkedIniIds=fd.getAll('ini_ids');
    const payload={data:d.data||null,numero:d.numero||null,ancora:d.ancora||null,formato:d.formato||null,problema:d.problema||null,resultado:d.resultado||null,aprendizados:d.aprendizados||null};
    let err, sessaoId=editing?editing.id:null;
    if(editing) err=await updateRow('sessoes',editing.id,payload);
    else { const r=await insertRow('sessoes',payload); err=r.error; sessaoId=r.data?r.data.id:null; }
    if(err){busy=false;toast('Erro ao salvar','err');console.error(err);b.disabled=false;return;}
    if(sessaoId){
      const {problemas,iniciativas}=sessaoFilaCandidatos(editing);
      for(const p of problemas){
        const shouldLink=checkedProbIds.includes(String(p.id));
        const isLinked=p.sessao_id===sessaoId;
        if(shouldLink&&!isLinked) await updateRow('problemas',p.id,{sessao_id:sessaoId});
        else if(!shouldLink&&isLinked) await updateRow('problemas',p.id,{sessao_id:null});
      }
      for(const c of iniciativas){
        const shouldLink=checkedIniIds.includes(String(c.id));
        const isLinked=c.sessao_id===sessaoId;
        if(shouldLink&&!isLinked) await updateRow('iniciativas',c.id,{sessao_id:sessaoId});
        else if(!shouldLink&&isLinked) await updateRow('iniciativas',c.id,{sessao_id:null});
      }
    }
    busy=false;
    await refreshAll(); openForm=null; render(); toast('Salvo','ok');
  });
}
function sessaoDetailHtml(s){
  const ligadas=cache.iniciativas.filter(c=>c.sessao_id===s.id);
  const lig=ligadas.length?ligadas.map(c=>{const col=iniColor(c.status);return `<div class="list-row" data-openini="${c.id}" style="margin-bottom:6px"><div class="status-bar" style="background:${col.c}"></div><div class="list-row-body"><div class="list-row-title" style="font-size:13px">${esc(c.codigo)} ${esc(c.titulo)}</div><div class="list-row-meta"><span class="badge" style="background:${col.bg};color:${col.c}">${c.status}</span></div></div></div>`;}).join(''):`<div style="font-size:13px;color:var(--text-muted)">Nenhuma iniciativa vinculada.</div>`;
  const problemasLig=cache.problemas.filter(p=>p.sessao_id===s.id);
  const ligProb=problemasLig.length?problemasLig.map(p=>{const score=impactScore(p);const gc=scoreColor(score);const sc=(PROB_STATUS_COLOR[p.status]||PROB_STATUS_COLOR['Novo']);return `<div class="list-row" data-openprob="${p.id}" style="margin-bottom:6px"><div class="status-bar" style="background:${sc.c}"></div><div class="list-row-body"><div class="list-row-title" style="font-size:13px">${esc(p.codigo)} ${esc(p.titulo)}</div><div class="list-row-meta"><span class="badge" style="background:${sc.bg};color:${sc.c}">${p.status}</span><span class="gut-badge" style="background:${gc.bg};color:${gc.c}">Score ${score.toFixed(1)}</span></div></div></div>`;}).join(''):`<div style="font-size:13px;color:var(--text-muted)">Nenhum problema vinculado.</div>`;
  return `<div class="card"><div class="top-actions" style="margin-bottom:8px"><span class="badge" style="background:var(--accent-soft);color:var(--accent)">${esc(s.codigo||'')} · Sessão ${esc(s.numero||'—')}</span><div class="btn-row" style="margin:0"><button class="btn btn-ghost" id="editSessaoBtn">Editar</button><button class="btn btn-ghost" id="deleteSessaoBtn" style="color:var(--rose)">Excluir</button><button class="btn btn-ghost" id="closeSessaoBtn">Voltar</button></div></div>
    <div class="detail-grid"><div class="detail-field"><div class="k">Data</div><div class="v">${fmtDate(s.data)}</div></div><div class="detail-field"><div class="k">Âncora</div><div class="v">${esc(s.ancora)||'—'}</div></div><div class="detail-field"><div class="k">Formato</div><div class="v">${esc(s.formato)||'—'}</div></div></div>
    <div class="detail-field" style="margin-bottom:12px"><div class="k">Notas / tema</div><div class="v">${esc(s.problema)||'—'}</div></div>
    <div class="detail-field" style="margin-bottom:12px"><div class="k">Decisões</div><div class="v">${esc(s.resultado)||'—'}</div></div>
    <div class="detail-field" style="margin-bottom:14px"><div class="k">Aprendizados</div><div class="v">${esc(s.aprendizados)||'—'}</div></div>
    <div class="divider"></div><div class="section-title">Problemas discutidos nesta sessão</div>${ligProb}
    <div class="section-title" style="margin-top:16px">Iniciativas priorizadas nesta sessão</div>${lig}
    ${timelineHtml(cache.comentarios,'sessao_id',s.id,'tlSessao')}
  </div>`;
}
function attachSessaoDetailHandlers(content,s){
  if(!s) return;
  content.querySelector('#closeSessaoBtn').addEventListener('click',()=>{openDetail=null;render();});
  content.querySelector('#editSessaoBtn').addEventListener('click',()=>{openForm='sessao';render();});
  content.querySelectorAll('[data-openini]').forEach(r=>r.addEventListener('click',()=>{currentTab='iniciativas';openDetail={type:'caso',id:r.dataset.openini};render();}));
  content.querySelectorAll('[data-openprob]').forEach(r=>r.addEventListener('click',()=>{currentTab='problemas';openDetail={type:'problema',id:r.dataset.openprob};render();}));
  content.querySelector('#deleteSessaoBtn').addEventListener('click', async ()=>{
    const probsLig=cache.problemas.filter(p=>p.sessao_id===s.id);
    const inisLig=cache.iniciativas.filter(c=>c.sessao_id===s.id);
    const aviso=(probsLig.length||inisLig.length)
      ? `Excluir esta sessão?\n\n${probsLig.length} problema(s) voltarão para "Novo" e ${inisLig.length} iniciativa(s) serão desvinculadas.`
      : 'Excluir esta sessão?';
    if(!confirm(aviso))return;
    // desvincular e resetar antes de apagar (garante o comportamento independente da FK)
    for(const p of probsLig){
      const jaPromovido=cache.iniciativas.some(c=>c.problema_id===p.id);
      const patch=jaPromovido?{sessao_id:null}:{sessao_id:null,status:'Novo'};
      const e=await updateRow('problemas',p.id,patch); if(e){toast('Erro ao desvincular problema','err');console.error(e);return;}
    }
    for(const c of inisLig){ const e=await updateRow('iniciativas',c.id,{sessao_id:null}); if(e){toast('Erro ao desvincular iniciativa','err');console.error(e);return;} }
    const err=await deleteRow('sessoes',s.id); if(err){toast('Erro','err');console.error(err);return;}
    await refreshAll(); openDetail=null; render(); toast('Sessão excluída · itens liberados','ok');
  });
  attachTimelineHandler(content,'tlSessao',{sessao_id:s.id});
}

boot();
</script>
</body>
</html>
